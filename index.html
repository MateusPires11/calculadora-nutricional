<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/reset.css">
    <link rel="stylesheet" href="/styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <title>Nutricional</title>
</head>

<body>
   

    <div class="conteiner">
        <form id="formCalculadora" class="Calculadora">
            <div class="item">
                <label for="sexo">Sexo</label>
                <select id="sexo" required>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                </select>
            </div>

            <div class="item">
                <label for="idade">Idade (anos)</label>
                <input type="number" id="idade" min="10" max="100" required>
            </div>


            <div class="item">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" min="30" max="300" step="0.1" required>

            </div>

            <div class="item">
                <label for="altura">Altura (cm)</label>
                <input type="number" id="altura" min="100" max="250" required>

            </div>

            <div class="item">
                <label for="atividade">Nível de atividade</label>
                <select id="atividade" required>
                    <option value="1.2">Sedentário</option>
                    <option value="1.375">Leve (1-3x/semana)</option>
                    <option value="1.55">Moderado (3-5x/semana)</option>
                    <option value="1.725">Intenso (6-7x/semana)</option>
                    <option value="1.9">Muito intenso (atleta)</option>
                </select>
            </div>

            <div class="item">
                <label for="objetivo">Objetivo</label>
                <select id="objetivo" required>
                    <option value="manter">Manter peso</option>
                    <option value="perder">Perder peso</option>
                    <option value="ganhar">Ganhar massa</option>
                </select>
            </div>

            <div class="botao item" id="botaoo">
                <button type="submit">Calcular</button>
            </div>

        </form>

        <div id="resultado" style="display:none;">
            <h3>Resultados</h3>
            <p>TMB: <span id="tmbResultado"></span> kcal</p>
            <p>Calorias diárias: <span id="tdeeResultado"></span> kcal</p>
            <p>Proteína: <span id="protResultado"></span> g</p>
            <p>Carboidrato: <span id="carboResultado"></span> g</p>
            <p>Gordura: <span id="gordResultado"></span> g</p>
        </div>
    </div>


    <script src="/scripts/scripts.js"></script>
</body>

</html>
